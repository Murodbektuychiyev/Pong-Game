<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pong Game: AI vs Player</title>
  <style>
    body {
      background: #e9eef3;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
    }
    .game-container {
      width: 700px;
      max-width: 99vw;
      margin: 0 auto;
      padding: 36px 28px 30px 28px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tab-container {
      display: flex;
      margin-bottom: 22px;
      gap: 20px;
      width: 100%;
    }
    .tab-container .tab {
      flex: 1;
      padding: 20px 0;
      background: #fff;
      border: 2px solid #007bff;
      border-radius: 14px;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      color: #007bff;
      transition: background 0.2s, color 0.2s;
      letter-spacing: .5px;
    }
    .tab-container .tab.active {
      background: #007bff;
      color: #fff;
      box-shadow: 0 2px 12px rgba(0,123,255,0.10);
    }
    .score-panel {
      display: flex;
      justify-content: space-between;
      font-size: 1.35rem;
      margin-bottom: 22px;
      width: 100%;
      padding: 0 12px;
      font-weight: 700;
      color: #222;
    }
    .pong-canvas {
      display: block;
      margin: 0 auto 14px auto;
      background: #222;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      outline: 0;
      border: 2px solid #007bff;
    }
    .setup-form {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }
    .setup-form label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 1.23rem;
      letter-spacing: .2px;
    }
    .setup-form input, .setup-form select {
      width: 100%;
      padding: 16px 12px;
      margin-bottom: 15px;
      font-size: 1.18rem;
      border-radius: 10px;
      border: 2px solid #007bff;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s;
    }
    .setup-form input:focus, .setup-form select:focus {
      border-color: #0056b3;
    }
    .setup-form button {
      width: 100%;
      padding: 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.35rem;
      margin-top: 22px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s;
      letter-spacing: .5px;
    }
    .setup-form button:hover {
      background: #0056b3;
    }
    .game-container h2, .game-container h3 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
      color: #007bff;
      font-size: 2.2rem;
    }
    .game-container h2 {
      margin-top: 38px;
      font-size: 2.4rem;
      letter-spacing: .5px;
    }
    .game-container p {
      font-size: 1.23rem;
      margin: 12px 0;
      text-align: center;
    }
    .game-container > button, .edit-btn {
      width: 100%;
      padding: 18px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.35rem;
      cursor: pointer;
      margin-top: 22px;
      font-weight: 700;
      letter-spacing: .3px;
      transition: background 0.2s;
      display: block;
    }
    .game-container > button:hover, .edit-btn:hover {
      background: #0056b3;
    }
    .edit-btn {
      width: auto;
      min-width: 110px;
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 12px;
      padding: 10px 20px;
      border-radius: 7px;
      float: right;
      display: inline-block;
    }
    .edit-form {
      width: 100%;
      max-width: 350px;
      margin: 0 auto 10px auto;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .edit-form input {
      flex: 1;
      padding: 12px 10px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 2px solid #007bff;
      outline: none;
      transition: border 0.2s;
    }
    .edit-form input:focus {
      border-color: #0056b3;
    }
    .edit-form button {
      padding: 12px 18px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.14rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .3px;
      transition: background 0.2s;
    }
    .edit-form button:hover {
      background: #0056b3;
    }
    @media (max-width: 900px) {
      .game-container {
        width: 99vw;
        padding: 8vw 2vw 7vw 2vw;
        border-radius: 0;
        box-shadow: none;
      }
      .setup-form {
        max-width: 100vw;
      }
      .pong-canvas {
        width: 98vw !important;
        height: 48vw !important;
        max-width: 650px !important;
        max-height: 310px !important;
      }
      .tab-container .tab, .setup-form button {
        font-size: 1.18rem;
        padding: 12px 0;
      }
      .setup-form input, .setup-form select {
        padding: 10px 8px;
        font-size: 1.07rem;
      }
      .score-panel {
        font-size: 1.07rem;
        padding: 0 6px;
      }
      .game-container h2, .game-container h3 {
        font-size: 1.45rem;
      }
      .edit-form input {
        padding: 8px 6px;
        font-size: 1rem;
      }
      .edit-form button {
        padding: 10px 14px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="center-wrap">
    <div id="root"></div>
  </div>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">

    function PongGame({ playerName, maxScore, mode, onRestart, onEditName }) {
      const canvasRef = React.useRef(null);
      // Score
      const [playerScore, setPlayerScore] = React.useState(0);
      const [aiScore, setAiScore] = React.useState(0);
      const [setNumber, setSetNumber] = React.useState(1);
      const [activeTab, setActiveTab] = React.useState('player');
      const [gameOver, setGameOver] = React.useState(false);

      // O'yin parametrlar
      const width = 650, height = 300;
      const paddleHeight = 68, paddleWidth = 18;
      const ballSize = 18;

      // AI paddle tezligi mode ga qarab
      const aiSpeedMap = { easy: 2, normal: 4.7, hard: 8 };
      const aiSpeed = aiSpeedMap[mode] || 4.7;

      // O'yin obyektlari
      const playerY = React.useRef(height / 2 - paddleHeight / 2);
      const aiY = React.useRef(height / 2 - paddleHeight / 2);
      const ball = React.useRef({
        x: width / 2 - ballSize / 2,
        y: height / 2 - ballSize / 2,
        dx: 6 * (Math.random() > .5 ? 1 : -1),
        dy: 4 * (Math.random() > .5 ? 1 : -1)
      });

      // O'yinni qayta boshlash
      function resetEverything() {
        setPlayerScore(0);
        setAiScore(0);
        setSetNumber(1);
        setGameOver(false);
        ball.current = {
          x: width / 2 - ballSize / 2,
          y: height / 2 - ballSize / 2,
          dx: 6 * (Math.random() > .5 ? 1 : -1),
          dy: 4 * (Math.random() > .5 ? 1 : -1)
        };
        playerY.current = height / 2 - paddleHeight / 2;
        aiY.current = height / 2 - paddleHeight / 2;
      }

      // Ball va paddle harakatlari
      React.useEffect(() => {
        let aniId;
        function draw() {
          const ctx = canvasRef.current.getContext('2d');
          ctx.clearRect(0, 0, width, height);

          // O'rtadagi yashil setka (dash)
          ctx.save();
          ctx.strokeStyle = "#00ff00";
          ctx.lineWidth = 5;
          ctx.setLineDash([18, 22]);
          ctx.beginPath();
          ctx.moveTo(width/2, 0);
          ctx.lineTo(width/2, height);
          ctx.stroke();
          ctx.restore();

          // Ball harakati
          ball.current.x += ball.current.dx;
          ball.current.y += ball.current.dy;

          // Ball yuqoriga-pastga uriladi
          if (ball.current.y <= 0 || ball.current.y + ballSize >= height) {
            ball.current.dy *= -1;
          }

          // Player paddle
          ctx.fillStyle = "#1e90ff";
          ctx.fillRect(20, playerY.current, paddleWidth, paddleHeight);

          // AI paddle
          ctx.fillStyle = "#ff9800";
          ctx.fillRect(width - paddleWidth - 20, aiY.current, paddleWidth, paddleHeight);

          // Ball
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(ball.current.x, ball.current.y, ballSize, 0, Math.PI * 2);
          ctx.fill();

          // Ball player paddle uradi
          if (
            ball.current.x <= 20 + paddleWidth &&
            ball.current.y + ballSize > playerY.current &&
            ball.current.y < playerY.current + paddleHeight
          ) {
            ball.current.dx = Math.abs(ball.current.dx);
          }

          // Ball AI paddle uradi
          if (
            ball.current.x + ballSize >= width - paddleWidth - 20 &&
            ball.current.y + ballSize > aiY.current &&
            ball.current.y < aiY.current + paddleHeight
          ) {
            ball.current.dx = -Math.abs(ball.current.dx);
          }

          // AI paddle harakati (mode ga qarab tezlik)
          if (aiY.current + paddleHeight / 2 < ball.current.y) aiY.current += aiSpeed;
          if (aiY.current + paddleHeight / 2 > ball.current.y) aiY.current -= aiSpeed;
          if (aiY.current < 0) aiY.current = 0;
          if (aiY.current > height - paddleHeight) aiY.current = height - paddleHeight;

          // Ball chapga chiqib ketdi (AI score)
          if (ball.current.x < 0) {
            setAiScore(s => {
              if (s + 1 >= maxScore) setGameOver(true);
              return s + 1;
            });
            setSetNumber(sn => sn + 1);
            ball.current = {
              x: width / 2 - ballSize / 2,
              y: height / 2 - ballSize / 2,
              dx: 6 * (Math.random() > .5 ? 1 : -1),
              dy: 4 * (Math.random() > .5 ? 1 : -1)
            };
          }
          // Ball o'ngga chiqib ketdi (player score)
          if (ball.current.x > width) {
            setPlayerScore(s => {
              if (s + 1 >= maxScore) setGameOver(true);
              return s + 1;
            });
            setSetNumber(sn => sn + 1);
            ball.current = {
              x: width / 2 - ballSize / 2,
              y: height / 2 - ballSize / 2,
              dx: -6 * (Math.random() > .5 ? 1 : -1),
              dy: 4 * (Math.random() > .5 ? 1 : -1)
            };
          }
        }

        function loop() {
          if (!gameOver) {
            draw();
            aniId = requestAnimationFrame(loop);
          }
        }
        aniId = requestAnimationFrame(loop);

        return () => cancelAnimationFrame(aniId);
      }, [gameOver, maxScore, mode]);

      // Player paddle harakati (touch/mouse)
      React.useEffect(() => {
        function move(e) {
          let y;
          if (e.touches) {
            y = e.touches[0].clientY - canvasRef.current.getBoundingClientRect().top;
          } else {
            y = e.clientY - canvasRef.current.getBoundingClientRect().top;
          }
          playerY.current = y - paddleHeight / 2;
          if (playerY.current < 0) playerY.current = 0;
          if (playerY.current > height - paddleHeight) playerY.current = height - paddleHeight;
        }
        const canvas = canvasRef.current;
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('touchmove', move);

        return () => {
          canvas.removeEventListener('mousemove', move);
          canvas.removeEventListener('touchmove', move);
        };
      }, []);

      // Tab aktivligi
      function handleTab(tab) {
        setActiveTab(tab);
      }

      // O'yin tugadi, natija
      const winner = playerScore >= maxScore ? playerName : (aiScore >= maxScore ? 'AI' : null);

      return (
        <div style={{width:'100%',display:'flex',flexDirection:'column',alignItems:'center'}}>
          {/* Edit name button */}
          <button className="edit-btn" onClick={onEditName}>Ismni o'zgartirish</button>
          {/* Tab panel */}
          <div className="tab-container">
            <div className={`tab ${activeTab === 'player' ? 'active' : ''}`} onClick={() => handleTab('player')}>{playerName}</div>
            <div className={`tab ${activeTab === 'ai' ? 'active' : ''}`} onClick={() => handleTab('ai')}>AI</div>
          </div>
          {/* Score panel + Set */}
          <div className="score-panel">
            <span>{playerName}: {playerScore}</span>
            <span>Set: {setNumber}</span>
            <span>AI: {aiScore}</span>
          </div>
          <p style={{marginBottom:0}}><b>Mode:</b> {mode.charAt(0).toUpperCase() + mode.slice(1)}</p>
          {/* Pong canvas */}
          <canvas
            ref={canvasRef}
            width={width}
            height={height}
            className="pong-canvas"
            style={{width:'100%',maxWidth:width, height:'300px',maxHeight:height, display:gameOver?'none':'block'}}
            tabIndex={0}
          />
          {/* Winner */}
          {gameOver && (
            <h2>
              {winner === playerName ? `${playerName} yutdi! 🎉` : 'AI yutdi! 🤖'}
            </h2>
          )}
          <button onClick={() => { resetEverything(); onRestart(); }}>Qayta boshlash</button>
        </div>
      );
    }

    function App() {
      // Try to get playerName and mode from localStorage
      const getStoredName = () => localStorage.getItem('pong_player_name') || '';
      const getStoredMode = () => localStorage.getItem('pong_mode') || 'normal';
      const [stage, setStage] = React.useState('setup');
      const [playerName, setPlayerName] = React.useState(getStoredName());
      const [maxScore, setMaxScore] = React.useState(5);
      const [mode, setMode] = React.useState(getStoredMode());
      const [editMode, setEditMode] = React.useState(false);
      const [editValue, setEditValue] = React.useState(playerName);

      React.useEffect(() => {
        localStorage.setItem('pong_player_name', playerName);
      }, [playerName]);
      React.useEffect(() => {
        localStorage.setItem('pong_mode', mode);
      }, [mode]);

      function handleStart(e) {
        e.preventDefault();
        if (!playerName.trim() || maxScore < 1) return;
        setStage('game');
      }
      function handleRestart() {
        setStage('setup');
        setMaxScore(5);
      }
      function handleEditName() {
        setEditValue(playerName);
        setEditMode(true);
      }
      function handleEditSubmit(e) {
        e.preventDefault();
        if (editValue.trim()) {
          setPlayerName(editValue.trim());
          localStorage.setItem('pong_player_name', editValue.trim());
          setEditMode(false);
        }
      }
      function handleEditCancel() {
        setEditMode(false);
      }

      return (
        <div className="game-container">
          {stage === 'setup' ? (
            <form className="setup-form" onSubmit={handleStart}>
              <h2>Pong: AI vs Player</h2>
              <div>
                <label>Ismingiz:</label>
                <input
                  type="text"
                  value={playerName}
                  onChange={e => setPlayerName(e.target.value)}
                  required
                  placeholder="Ism kiriting..."
                />
              </div>
              <div>
                <label>Necha achkogacha o'ynaysiz?</label>
                <input
                  type="number"
                  min={1}
                  max={30}
                  value={maxScore}
                  onChange={e => setMaxScore(Number(e.target.value))}
                  required
                  placeholder="Masalan: 5, 10, 15"
                />
              </div>
              <div>
                <label>Mode tanlang:</label>
                <select value={mode} onChange={e => setMode(e.target.value)}>
                  <option value="easy">Easy (Yengil)</option>
                  <option value="normal">Normal (O‘rtacha)</option>
                  <option value="hard">Hard (Qiyin)</option>
                </select>
              </div>
              <button type="submit">Boshlash</button>
            </form>
          ) : editMode ? (
            <form className="edit-form" onSubmit={handleEditSubmit}>
              <input
                type="text"
                value={editValue}
                onChange={e => setEditValue(e.target.value)}
                autoFocus
                required
                placeholder="Yangi ism kiriting..."
              />
              <button type="submit">Saqlash</button>
              <button type="button" onClick={handleEditCancel} style={{background:"#aaa",color:"#fff"}}>Bekor</button>
            </form>
          ) : (
            <PongGame
              playerName={playerName}
              maxScore={maxScore}
              mode={mode}
              onRestart={handleRestart}
              onEditName={handleEditName}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
